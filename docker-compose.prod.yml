# ClassHelper 프로덕션 배포용 스택 (EC2 등 단일 서버에서 docker compose로 실행).
# 로컬 개발용 docker-compose.yml(Postgres만 띄움)과는 별개 파일입니다.
#
# backend/frontend는 더 이상 EC2에서 직접 빌드하지 않습니다 — GitHub Actions가
# dev 브랜치 push마다 이미지를 빌드해 ghcr.io에 올리고, watchtower가 새 이미지를
# 감지해 자동으로 pull + 재시작합니다. (.github/workflows/docker-publish.yml 참고)
#
# 사용법 (최초 1회, repo 루트에서):
#   1) 이 파일과 같은 위치에 .env 파일을 만들고 POSTGRES_PASSWORD를 채운다
#   2) backend/.env.production.example -> backend/.env 로 복사 후 값 채움
#      (DATABASE_URL의 비밀번호는 위 POSTGRES_PASSWORD와 반드시 동일해야 함)
#   3) ghcr.io 이미지가 private라면: docker login ghcr.io -u <github계정> -p <PAT>
#   4) docker compose -f docker-compose.prod.yml up -d
# 마이그레이션은 backend 컨테이너 시작 시 자동 적용됨 (Dockerfile CMD 참고) — 수동 exec 불필요.

services:
  postgres:
    image: postgres:16-alpine
    container_name: classhelper-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: classhelper_user
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 루트 .env에 설정되어야 합니다}'
      POSTGRES_DB: classhelper_db
      TZ: Asia/Seoul
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U classhelper_user -d classhelper_db']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/moscops/classhelper-backend:latest
    container_name: classhelper-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'

  frontend:
    # NEXT_PUBLIC_API_URL은 이제 GitHub Actions 빌드 시점에 build-arg로 박혀서 이미지에 이미 포함됨
    # (repo Settings > Actions > Variables의 NEXT_PUBLIC_API_URL) — 여기서 더 이상 안 넘김.
    image: ghcr.io/moscops/classhelper-frontend:latest
    container_name: classhelper-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3001:3000'

  # dev 브랜치 push -> GitHub Actions가 새 이미지를 ghcr.io에 푸시하면,
  # 60초 간격으로 확인해서 backend/frontend 컨테이너를 자동 pull + 재생성.
  # postgres/watchtower 자신은 감시 대상에서 제외(뒤에 컨테이너명을 명시했으므로).
  watchtower:
    image: containrrr/watchtower
    container_name: classhelper-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # ghcr.io 이미지가 private라서 pull 인증이 필요한데, docker socket을 마운트한다고
      # host의 `docker login` 정보까지 자동으로 물려받는 게 아님 — watchtower 컨테이너 자체에
      # 인증 파일(/config.json)을 따로 넣어줘야 함(공식 문서 방식). EC2에서 root로 로그인했으므로
      # /root/.docker/config.json을 그대로 마운트. 다른 계정으로 로그인했다면 경로를 그에 맞게 수정.
      - /root/.docker/config.json:/config.json:ro
    environment:
      TZ: Asia/Seoul
      # watchtower 이미지에 내장된 도커 클라이언트가 기본 API 1.25를 써서, EC2의 실제 도커 데몬
      # (API 1.55, 최소 1.40 요구)과 버전이 안 맞아 "client version too old"로 계속 재시작하던 문제.
      # 실제 서버 API 버전(`docker version --format '{{.Server.APIVersion}}'`)에 맞춰 강제 지정.
      DOCKER_API_VERSION: '1.55'
    command: --interval 60 --cleanup classhelper-backend classhelper-frontend

  # classhelper.co.kr 도메인 연결용 리버스 프록시. backend(3000)/frontend(3001)는
  # 지금까지 IP:포트로만 접근 가능했음 — Caddy가 80/443을 받아 도메인별로
  # 내부 컨테이너 포트(3000)로 라우팅하고, Let's Encrypt 인증서 발급/갱신도 자동 처리한다.
  # 전제조건: classhelper.co.kr / www / api A 레코드가 이 서버 IP로 먼저 연결되어 있어야
  # 인증서 발급이 성공한다(DNS가 안 풀리면 컨테이너는 뜨지만 인증서 발급에서 계속 실패함).
  caddy:
    image: caddy:2-alpine
    container_name: classhelper-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  # 로컬 개발용 docker-compose.yml의 pgdata 볼륨(=기존 개발 DB)과 이름이 겹치면 그걸 그대로
  # 재사용해버려서(둘 다 같은 폴더라 볼륨명이 <폴더명>_pgdata로 겹침) "프로덕션 테스트"인데
  # 실제로는 개발 데이터가 섞이는 사고가 남. 반드시 구분되는 이름을 쓸 것.
  pgdata_prod:
  # Let's Encrypt 인증서/Caddy 내부 상태 보존용 — 삭제하면 컨테이너 재시작마다 인증서 재발급 시도.
  caddy_data:
  caddy_config:
