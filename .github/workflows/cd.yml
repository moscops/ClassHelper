name: CD Pipeline (Release & Deploy)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  validate-and-release:
    name: Production Release & Deployment Readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: |
            backend/yarn.lock
            frontend/yarn.lock

      - name: Install Backend & Build
        working-directory: backend
        run: |
          yarn install --prefer-offline --ignore-engines
          yarn prisma:generate
          yarn build

      - name: Install Frontend & Build
        working-directory: frontend
        run: |
          yarn install --prefer-offline --ignore-engines
          yarn build

      - name: Release Artifacts Check
        run: |
          echo "✅ Backend dist build verified:"
          ls -la backend/dist
          echo "✅ Frontend Next.js production build verified:"
          ls -la frontend/.next
